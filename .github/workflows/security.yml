name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify no sensitive runtime files are tracked
        run: |
          if git ls-files | grep -E '\.(env|db|sqlite|pem|key|p12|pfx)$|^storage/[^.]'; then
            echo "Sensitive or runtime file is tracked in Git!"
            exit 1
          fi

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high || true
