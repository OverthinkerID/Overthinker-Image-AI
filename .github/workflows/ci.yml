name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client & validate migrations
        working-directory: apps/api
        env:
          DATABASE_URL: "file:./ci-test.db"
        run: |
          npx prisma generate
          npx prisma migrate deploy
          rm -f prisma/ci-test.db

      - name: Build & test API
        working-directory: apps/api
        run: |
          npm run build
          npm test

      - name: Typecheck & build Web
        working-directory: apps/web
        run: |
          npx tsc --noEmit
          npm run build
